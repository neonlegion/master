# XcodeGen project spec — run `xcodegen generate` on macOS, then open and build.
# The AUv3 audio-unit extension is an app extension (.appex); install it to
# ~/Library/Audio/AudioUnits/Components and rescan (restart Logic or `auval -a`).
# Logic renders the parameter tree (groups, names, units, value strings) in its
# generic AU view; the read-only "Meters" parameter group shows live levels.
name: MasteringAU
options:
  bundleIdPrefix: com.vibe
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SDKROOT: macosx
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    GCC_OPTIMIZATION_LEVEL: 2

targets:
  MasteringAU:
    type: app-extension
    platform: macOS
    productName: MasteringAU
    bundleId: com.vibe.MasteringAU
    sources:
      - path: Source/Plugin/MasteringAU.mm
    settings:
      base:
        PRODUCT_BUNDLE_PACKAGE_TYPE: XPC!
        WRAPPER_EXTENSION: appex
        SKIP_INSTALL: YES
        INFOPLIST_FILE: Source/Plugin/Info.plist
        CODE_SIGN_ENTITLEMENTS: Source/Plugin/entitlements.plist
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/Frameworks"
