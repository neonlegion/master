# XcodeGen project spec — run `xcodegen generate` on macOS, then open and build.
# The AUv3 audio-unit extension is an app extension (.appex); install it to
# ~/Library/Audio/AudioUnits/Components and rescan (restart Logic or `auval -a`).
# Logic renders the parameter tree (groups, names, units, value strings) in its
# generic AU view; the read-only "Meters" parameter group shows live levels.
name: MasteringAU
options:
  bundleIdPrefix: com.vibe
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SDKROOT: macosx
    # Ad-hoc sign ("-"): required so AudioComponentRegistrar accepts the appex
    # without needing an Apple Developer team.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGN_STYLE: Manual
    CLANG_ENABLE_MODULES: YES
    SWIFT_VERSION: 5.0
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    # Force -std=c++17 on every C++/ObjC++ compile; OTHER_*FLAGS are appended
    # last on the clang command line, so this wins even if the language-standard
    # setting is not resolved as expected (XcodeGen's base preset is gnu++14 and
    # the clang 15 default is gnu++98, which breaks libc++'s <new>).
    OTHER_CPLUSPLUSFLAGS: "-std=c++17"
    GCC_OPTIMIZATION_LEVEL: 2

targets:
  MasteringAU:
    type: app-extension
    platform: macOS
    productName: MasteringAU
    # NOTE: XcodeGen 2.42 has no target-level `bundleId` key (it is silently
    # ignored and PRODUCT_BUNDLE_IDENTIFIER defaults to bundleIdPrefix + name).
    # Set it explicitly: the embedded appex id must be prefixed with the host
    # app's id or ValidateEmbeddedBinary fails and pluginkit rejects it.
    sources:
      - path: Source/Plugin/MasteringAU.mm
        compiler-flags: "-std=c++17"
    dependencies:
      - sdk: Foundation.framework
      - sdk: AVFAudio.framework
      - sdk: AudioToolbox.framework
    settings:
      base:
        PRODUCT_BUNDLE_PACKAGE_TYPE: XPC!
        WRAPPER_EXTENSION: appex
        SKIP_INSTALL: YES
        INFOPLIST_FILE: Source/Plugin/Info.plist
        # pkd (PlugInKit) refuses to register an appex whose signature lacks
        # the app-sandbox entitlement ("plug-ins must be sandboxed"); ad-hoc
        # signing with entitlements registers fine on macOS.
        CODE_SIGN_ENTITLEMENTS: Source/Plugin/entitlements.plist
        GENERATE_INFOPLIST_FILE: NO
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        OTHER_CPLUSPLUSFLAGS: "-std=c++17"
        PRODUCT_BUNDLE_IDENTIFIER: com.vibe.MasteringAUHost.MasteringAU
        OTHER_LDFLAGS: "-framework Foundation -framework AVFAudio -framework AudioToolbox"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/Frameworks"

  # AUv2 in-process component (MasteringAU.component) — the Logic-stable path.
  # Install the built bundle to ~/Library/Audio/Plug-Ins/Components and rescan.
  # Uses Apple's AudioUnitSDK (vendored under Source/Component/AudioUnitSDK, the
  # AUPublic C++ classes Apple no longer ships in the OS SDK).
  MasteringAUComponent:
    type: bundle
    platform: macOS
    productName: MasteringAU
    sources:
      - path: Source/Component/MasteringAUv2.cpp
        compiler-flags: "-std=c++20"
      - path: Source/Component/MasteringAUView.mm
      - path: Source/Component/AudioUnitSDK/src
    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework
      - sdk: Foundation.framework
      - sdk: AppKit.framework
      - sdk: CoreMIDI.framework
    settings:
      base:
        PRODUCT_BUNDLE_PACKAGE_TYPE: BNDL
        WRAPPER_EXTENSION: component
        INFOPLIST_FILE: Source/Component/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.vibe.MasteringAU.component
        SKIP_INSTALL: YES
        CLANG_ENABLE_OBJC_ARC: NO
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        OTHER_CPLUSPLUSFLAGS: "-std=c++20"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Source/Component/AudioUnitSDK"
        OTHER_LDFLAGS: "-framework AudioToolbox -framework CoreAudio -framework CoreFoundation -framework Foundation -framework AppKit -framework CoreMIDI"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/Frameworks"

  # Minimal host app: embeds MasteringAU.appex in Contents/PlugIns. Launching
  # this app registers the AUv3 extension with PluginKit, after which auval
  # and Logic Pro can see the audio unit. (A bare .appex in a Components dir
  # is NOT registered on modern macOS.)
  MasteringAUHost:
    type: application
    platform: macOS
    productName: MasteringAUHost
    sources:
      - path: Source/Host/main.swift
    dependencies:
      - target: MasteringAU
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibe.MasteringAUHost
        INFOPLIST_FILE: Source/Host/Info.plist
        CODE_SIGN_ENTITLEMENTS: Source/Host/entitlements.plist
        GENERATE_INFOPLIST_FILE: NO
